<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172d3f"/>
      <stop offset="0.55" stop-color="#07324a"/>
      <stop offset="1" stop-color="#071b2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#00a8e8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00b8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46d8ff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#29c9ff"/>
      <stop offset="1" stop-color="#8ce8ff"/>
    </linearGradient>
    <filter id="arrowGlow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="440" fill="url(#background)"/>
  <rect width="680" height="440" fill="url(#glow)"/>
  <circle cx="80" cy="54" r="150" fill="#ffffff" opacity="0.035"/>
  <circle cx="650" cy="420" r="180" fill="#00111d" opacity="0.24"/>

  <text x="340" y="56" text-anchor="middle" fill="#f7fbff"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700">
    OpenKeyboardCleanTool
  </text>
  <text x="340" y="82" text-anchor="middle" fill="#a9bac7"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">
    Drag the app to Applications
  </text>

  <path d="M278 235 H398" fill="none" stroke="url(#arrow)" stroke-width="8"
        stroke-linecap="round" filter="url(#arrowGlow)"/>
  <path d="M382 217 L405 235 L382 253" fill="none" stroke="#7ee5ff"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)"/>

  <g fill="#d6f5ff" opacity="0.055">
    <rect x="548" y="42" width="16" height="16" rx="4"/>
    <rect x="570" y="42" width="16" height="16" rx="4"/>
    <rect x="592" y="42" width="16" height="16" rx="4"/>
    <rect x="559" y="64" width="38" height="9" rx="4.5"/>
  </g>
</svg>
