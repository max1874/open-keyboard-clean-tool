name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build privacy-preserving macOS release candidate
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install DMG tooling
        run: |
          brew install create-dmg
          test "$(create-dmg --version)" = "create-dmg 1.3.0"

      - name: Test
        run: swift test

      - name: Read version
        id: version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          case "$version" in
            ''|*[!0-9A-Za-z.-]*) echo "Invalid release version: $version" >&2; exit 1 ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build ad-hoc signed DMG
        env:
          SIGN_IDENTITY: '-'
        run: make dmg

      - name: Audit mounted release image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/audit-release.sh "build/OpenKeyboardCleanTool-$VERSION.dmg" "$VERSION"

      - name: Write checksum
        working-directory: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: shasum -a 256 "OpenKeyboardCleanTool-$VERSION.dmg" > "OpenKeyboardCleanTool-$VERSION.dmg.sha256"

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OpenKeyboardCleanTool-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            build/OpenKeyboardCleanTool-${{ steps.version.outputs.version }}.dmg
            build/OpenKeyboardCleanTool-${{ steps.version.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: 7
